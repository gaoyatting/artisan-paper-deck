<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>范例 09 · 裁切角标记框 — minimal-editorial-layout</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;1,400&family=Noto+Serif+SC:wght@400;600&family=Jost:wght@300;400&family=Courier+Prime&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F5F1E6;
    --ink:#221F1A;
    --accent:#A65235;
    --bronze:#8A6B3E;
    --muted:rgba(34,31,26,.6);
    --hairline:rgba(34,31,26,.4);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;background:var(--bg);overflow:hidden;display:flex;align-items:center;justify-content:center;}
  .stage{width:1280px;height:720px;background:var(--bg);position:relative;flex:none;transform-origin:center;
         font-family:'Jost',-apple-system,'PingFang SC',sans-serif;color:var(--ink);}

  .meta-top{position:absolute;left:128px;right:128px;top:36px;display:flex;justify-content:space-between;
        font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:var(--muted);z-index:10;}

  /* 全幅 SVG 装饰层（裁切框虚线 + 四角定位像素） */
  .cropsvg{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;z-index:1;}

  /* 裁切区域内内容（左侧编号+主标题，右侧文段） */
  .inner-left{position:absolute;left:190px;top:200px;z-index:2;}
  .inner-left .no{font-family:'Playfair Display',serif;font-size:84px;line-height:1;}
  .inner-left .no::after{content:"/";color:var(--accent);margin-left:6px;}
  .inner-left h1{font-family:'Noto Serif SC',serif;font-size:52px;font-weight:600;
        letter-spacing:.12em;line-height:1.2;margin-top:20px;white-space:nowrap;}
  .inner-left .en{font-family:'Playfair Display',serif;font-style:italic;font-size:16px;
        color:var(--muted);margin-top:12px;letter-spacing:.05em;}

  .v-rule{position:absolute;left:640px;top:140px;bottom:120px;width:1px;background:var(--hairline);z-index:2;}

  .inner-right{position:absolute;left:700px;right:190px;top:220px;z-index:2;}
  .inner-right .kicker{font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:var(--muted);margin-bottom:24px;}
  .inner-right p{font-weight:300;font-size:17px;line-height:2.1;color:var(--muted);letter-spacing:.02em;}
  .inner-right .em-word{color:var(--ink);font-style:normal;font-weight:500;}

  .foot-rule{position:absolute;left:128px;bottom:36px;display:flex;align-items:baseline;gap:20px;
        font-family:'Courier Prime',monospace;font-size:11px;letter-spacing:.18em;color:var(--muted);z-index:2;}
  .foot-rule .line{width:120px;height:1px;background:var(--hairline);}
</style>
</head>
<body>
<div class="stage">
  <div class="meta-top"><span>Crop-Mark Frame</span><span>版式范例 · 08</span></div>

  <!-- 裁切框 SVG 装饰（虚线 + 四角定位方块，水平垂直居中） -->
  <svg class="cropsvg" viewBox="0 0 1280 720">
    <!-- 内框虚线边界: 左右 150px / 1130px, 上下 110px / 610px -->
    <line x1="150" y1="90" x2="150" y2="630" stroke="#221F1A" stroke-opacity=".5" stroke-width="1.2" stroke-dasharray="2 7"/>
    <line x1="1130" y1="90" x2="1130" y2="630" stroke="#221F1A" stroke-opacity=".5" stroke-width="1.2" stroke-dasharray="2 7"/>
    <line x1="100" y1="120" x2="1180" y2="120" stroke="#221F1A" stroke-opacity=".5" stroke-width="1.2" stroke-dasharray="2 7"/>
    <line x1="100" y1="600" x2="1180" y2="600" stroke="#221F1A" stroke-opacity=".5" stroke-width="1.2" stroke-dasharray="2 7"/>

    <!-- 四角黑白棋盘定位像素 (左上) -->
    <rect x="142" y="112" width="8" height="8" fill="#221F1A"/>
    <rect x="150" y="112" width="8" height="8" fill="none"/>
    <rect x="142" y="120" width="8" height="8" fill="none"/>
    <rect x="150" y="120" width="8" height="8" fill="#221F1A"/>

    <!-- 右上 (铜色) -->
    <rect x="1122" y="112" width="8" height="8" fill="#8A6B3E"/>
    <rect x="1130" y="112" width="8" height="8" fill="none"/>
    <rect x="1122" y="120" width="8" height="8" fill="none"/>
    <rect x="1130" y="120" width="8" height="8" fill="#8A6B3E"/>

    <!-- 左下 -->
    <rect x="142" y="592" width="8" height="8" fill="#221F1A"/>
    <rect x="150" y="592" width="8" height="8" fill="none"/>
    <rect x="142" y="600" width="8" height="8" fill="none"/>
    <rect x="150" y="600" width="8" height="8" fill="#221F1A"/>

    <!-- 右下 (铜色) -->
    <rect x="1122" y="592" width="8" height="8" fill="#8A6B3E"/>
    <rect x="1130" y="592" width="8" height="8" fill="none"/>
    <rect x="1122" y="600" width="8" height="8" fill="none"/>
    <rect x="1130" y="600" width="8" height="8" fill="#8A6B3E"/>
  </svg>

  <div class="inner-left">
    <div class="no">02</div>
    <h1>设计探索</h1>
    <div class="en">Phase Two · Creative Exploration</div>
  </div>

  <div class="v-rule"></div>

  <div class="inner-right">
    <div class="kicker">Visual Identity Direction</div>
    <p>
      我们围绕你的品牌故事发展<em class="em-word">两条视觉方向</em>：<br>
      每个概念均配齐情绪板、质感参考与版面样章，为活动的整体调性提供截然不同的起点，在清晰从容的对比中确立最笃定的选择。
    </p>
  </div>

  <div class="foot-rule">
    <span>CROP-MARK FRAME</span>
    <span class="line"></span>
    <span>08 / 08</span>
  </div>
</div>
<script>
  const W=1280,H=720;
  function fit(){
    const s=Math.min(innerWidth/W,innerHeight/H);
    document.querySelector('.stage').style.transform=`scale(${s})`;
  }
  addEventListener('resize',fit);fit();
</script>
</body>
</html>
