<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>范例 03 · 同心嵌套圆 — minimal-editorial-layout</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Playfair+Display:ital,wght@0,400;1,400&family=Noto+Serif+SC:wght@400;600&family=Jost:wght@300;400&family=Courier+Prime&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#F5F1E6;
    --ink:#221F1A;
    --accent:#A65235;
    --muted:rgba(34,31,26,.6);
    --hairline:rgba(34,31,26,.4);
  }
  *{margin:0;padding:0;box-sizing:border-box;}
  html,body{height:100%;background:var(--bg);overflow:hidden;display:flex;align-items:center;justify-content:center;}
  .stage{width:1280px;height:720px;background:var(--bg);position:relative;flex:none;transform-origin:center;
         font-family:'Jost',-apple-system,'PingFang SC',sans-serif;color:var(--ink);}

  .meta-top{position:absolute;left:128px;right:128px;top:36px;display:flex;justify-content:space-between;
        font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:var(--muted);z-index:10;}

  /* 顶部居中标题 */
  .header{position:absolute;left:0;right:0;top:68px;text-align:center;}
  .kicker{font-size:11px;letter-spacing:.35em;text-transform:uppercase;color:var(--muted);}
  h1{font-family:'Noto Serif SC',serif;font-size:44px;font-weight:600;letter-spacing:.08em;margin-top:8px;}
  h1 .anno{font-family:'Playfair Display',serif;font-style:italic;font-weight:400;color:var(--accent);margin-left:8px;}
  .desc{margin-top:8px;font-weight:300;font-size:14px;color:var(--muted);letter-spacing:.04em;white-space:nowrap;}

  /* 中间居中同心圆区域 (宽度 900px, 居中放置在 left: 190px, 中心坐标 640px) */
  .diagram-box{position:absolute;left:190px;top:180px;width:900px;height:460px;}
  svg.circles-svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible;}

  /* 标签单行展示，绝对不折行、不重叠 */
  .ring-tag{position:absolute;display:flex;align-items:baseline;gap:10px;white-space:nowrap;z-index:5;}
  .ring-tag .num{font-family:'Playfair Display',serif;font-size:18px;font-weight:400;}
  .ring-tag .num::after{content:".";color:var(--accent);}
  .ring-tag .title{font-family:'Noto Serif SC',serif;font-size:16px;font-weight:600;letter-spacing:.08em;}
  .ring-tag .en{font-family:'Playfair Display',serif;font-style:italic;font-size:12px;color:var(--muted);}

  .foot-rule{position:absolute;left:128px;right:128px;bottom:36px;display:flex;
        justify-content:space-between;align-items:baseline;
        font-family:'Courier Prime',monospace;font-size:11px;letter-spacing:.18em;color:var(--muted);}
</style>
</head>
<body>
<div class="stage">
  <div class="meta-top"><span>Nested Circles</span><span>版式范例 · 02</span></div>

  <div class="header">
    <div class="kicker">Three Realms · Inward Out</div>
    <h1>同心圈层<span class="anno">Concentric Tiers</span></h1>
    <p class="desc">由直觉内核向外推演的三重感知：守护内省，建立理性边界，与广阔世界形成共振。</p>
  </div>

  <!-- 中心点: (450, 230) -->
  <div class="diagram-box">
    <svg class="circles-svg" viewBox="0 0 900 460">
      <!-- 外圈 R=210 -->
      <circle cx="450" cy="230" r="210" fill="none" stroke="#221F1A" stroke-width="1"/>
      <!-- 中圈 R=140 -->
      <circle cx="450" cy="230" r="140" fill="none" stroke="#221F1A" stroke-width="1"/>
      <!-- 内圈 R=70 -->
      <circle cx="450" cy="230" r="70" fill="none" stroke="#221F1A" stroke-width="1"/>
      <!-- 中心红点 -->
      <circle cx="450" cy="230" r="3.5" fill="#A65235"/>

      <!-- 03 外圈水平引线 (从顶部圆周 (450, 20) 向右拉出至 x=680) -->
      <circle cx="450" cy="20" r="3" fill="#221F1A"/>
      <line x1="450" y1="20" x2="680" y2="20" stroke="#221F1A" stroke-width="1" stroke-dasharray="3 4"/>

      <!-- 02 中圈水平引线 (从右侧圆周 (590, 230) 向右拉出至 x=680) -->
      <circle cx="590" cy="230" r="3" fill="#221F1A"/>
      <line x1="590" y1="230" x2="680" y2="230" stroke="#221F1A" stroke-width="1" stroke-dasharray="3 4"/>

      <!-- 01 内圈水平引线 (从底部圆周 (450, 300) 向右拉出至 x=680) -->
      <circle cx="450" cy="300" r="3" fill="#221F1A"/>
      <line x1="450" y1="300" x2="680" y2="300" stroke="#221F1A" stroke-width="1" stroke-dasharray="3 4"/>
    </svg>

    <!-- 03 外圈标签 (在 x=695px 处单行排开，远离圆周 85px) -->
    <div class="ring-tag" style="left:695px;top:10px;">
      <span class="num">03</span>
      <span class="title">场域共鸣</span>
      <span class="en">Field / Horizon</span>
    </div>

    <!-- 02 中圈标签 (在 x=695px 处单行排开) -->
    <div class="ring-tag" style="left:695px;top:220px;">
      <span class="num">02</span>
      <span class="title">理性边界</span>
      <span class="en">Rational Boundary</span>
    </div>

    <!-- 01 内核标签 (在 x=695px 处单行排开) -->
    <div class="ring-tag" style="left:695px;top:290px;">
      <span class="num">01</span>
      <span class="title">直觉内核</span>
      <span class="en">Core Intuition</span>
    </div>
  </div>

  <div class="foot-rule">
    <span>CONCENTRIC SYSTEM</span>
    <span style="letter-spacing:.25em;">PERCEPTION ARCHITECTURE</span>
    <span>02 / 05</span>
  </div>
</div>
<script>
  const W=1280,H=720;
  function fit(){
    const s=Math.min(innerWidth/W,innerHeight/H);
    document.querySelector('.stage').style.transform=`scale(${s})`;
  }
  addEventListener('resize',fit);fit();
</script>
</body>
</html>
